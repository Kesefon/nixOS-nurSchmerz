name: "Rolling release updates"
on:
  push:
    branches:
      - 'miau'
  schedule:
    - cron: '0 12 * * 5' # always deploy on a friday
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-25.11
    - run: nix flake update --accept-flake-config
    - run: nix flake check --accept-flake-config
    - name: "Push update"
      run : |
        git checkout -B rolling
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit flake.lock -m "automatic update $(date -I)" --allow-empty
        git push -f --set-upstream origin rolling

  cache-build:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04-arm
            target: cloudbox
          - host: ubuntu-latest
            target: shitbox
          - host: ubuntu-24.04-arm
            target: smolbox
          - host: ubuntu-latest
            target: togobox

    runs-on: ${{ matrix.host }}
    env:
      NIX_BUILD_CORES: 0
    steps:
    - uses: cachix/install-nix-action@v31.10.1
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v16
      with:
        name: kesefon
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix build --profile /nix/var/nix/profiles/system -L github:kesefon/nixOS-nurSchmerz/rolling#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel
      continue-on-error: true